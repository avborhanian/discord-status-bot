name: Deploy

on:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: "false"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .github/workflows/image
        push: true
        tags: avbor/avbor:protoc

    - name: Install cross
      uses: taiki-e/install-action@cross

    - name: Build binary
      run: cross build --target arm-unknown-linux-gnueabihf --locked --release

    - name: Package as archive
      shell: bash
      run: |
        cp target/arm-unknown-linux-gnueabihf/release/discord_status_bot discord_status_bot

    - name: Copy over
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT }}
        source: "discord_status_bot"
        target: ${{ secrets.TARGET_DIR }}

    - name: Restarting the job
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT }}
        script: cd ${{secrets.TARGET_DIR}} && sudo ./start_job.sh

  relay-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: "false"

    - name: Build relay binary
      run: cargo build -p lcu_relay --release --locked

    - name: Upload relay artifact
      uses: actions/upload-artifact@v4
      with:
        name: lcu_relay-windows
        path: target/release/lcu_relay.exe

